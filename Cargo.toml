[package]
name = "voyage"
version = "0.1.0"
edition = "2021"
description = "A GTK4 installer for Void Linux, built directly on the official void-installer shell backend"
license = "GPL-3.0-or-later"

[[bin]]
name = "voyage"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
gio = "0.20"
glib = "0.20"
gdk = { package = "gdk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

# Deviation from caerus's optional-libadwaita pattern: the wizard UI ported
# from ui/pages/*.py is built entirely on Adwaita widgets (PreferencesGroup,
# EntryRow, ComboRow, ToolbarView, NavigationSplitView, ...), not just
# accented by them, so libadwaita is a hard dependency here rather than an
# opt-in feature.

[profile.release]
opt-level = 2
debug = true
