[package]
name = "voyage"
version = "0.1.0"
edition = "2021"
description = "A GTK4 installer for Void Linux, built directly on the official void-installer shell backend"
license = "GPL-3.0-or-later"

[[bin]]
name = "voyage"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
gio = "0.20"
glib = "0.20"
gdk = { package = "gdk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"], optional = true }
ureq = { version = "2", default-features = false, features = ["tls"] }
async-channel = "2"

# Plain GTK4 is the default: no runtime dependency on libadwaita. Enable with
# `--features adwaita` for the libadwaita widgets and palette (same pattern as caerus).
[features]
adwaita = ["dep:adw"]

[profile.release]
opt-level = 2
debug = true
