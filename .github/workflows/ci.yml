name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-linux:latest-full-x86_64

    steps:
      - name: Install build dependencies
        run: |
          xbps-install -Sy
          xbps-install -uy xbps
          xbps-install -Suy
          xbps-install -y base-devel rust cargo git pkg-config gtk4-devel libadwaita-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build
        run: cargo build --locked

      - name: Run tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Build and lint with the adwaita feature
        run: |
          cargo build --locked --features adwaita
          cargo clippy --locked --all-targets --features adwaita -- -D warnings
