<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb488"/>
      <stop offset="1" stop-color="#2f6b4c"/>
    </linearGradient>
    <linearGradient id="sailMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eafff2"/>
    </linearGradient>
    <linearGradient id="sailJib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafff2"/>
      <stop offset="1" stop-color="#c9ede0"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff5ec"/>
      <stop offset="1" stop-color="#b3ded1"/>
    </linearGradient>
  </defs>

  <!-- squircle backdrop, Void green (same as Caerus) -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>
  <!-- soft top highlight for depth -->
  <ellipse cx="64" cy="30" rx="46" ry="20" fill="#ffffff" opacity="0.08"/>

  <!-- water -->
  <path d="M22 87 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#eafff2"
        stroke-width="3" stroke-linecap="round" opacity="0.32"/>
  <path d="M30 98 q8 -6 16 0 t16 0 t16 0" fill="none" stroke="#eafff2"
        stroke-width="3" stroke-linecap="round" opacity="0.18"/>

  <!-- faceted sailboat, same three-shade lighting as the Caerus box -->
  <g transform="translate(56,58)">
    <!-- main sail (lit side) -->
    <path d="M3 -38 L3 10 L31 10 Z" fill="url(#sailMain)"/>
    <!-- jib (shaded side) -->
    <path d="M-3 -28 L-3 10 L-25 10 Z" fill="url(#sailJib)"/>
    <!-- hull -->
    <path d="M-34 14 L34 14 L23 29 L-23 29 Z" fill="url(#hull)"/>
    <!-- seams: mast and deck line -->
    <path d="M0 -42 L0 14 M-34 14 L34 14" stroke="#2f6b4c" stroke-width="1.5"
          stroke-linejoin="round" stroke-linecap="round" opacity="0.35" fill="none"/>
  </g>

  <!-- install badge, bottom-right (arrow down onto the disk) -->
  <circle cx="93" cy="93" r="21" fill="#1d3b2c"/>
  <circle cx="93" cy="93" r="21" fill="none" stroke="#eafff2" stroke-width="1.5" opacity="0.2"/>
  <path d="M93 81 L93 99 M84 91 L93 100 L102 91" fill="none" stroke="#eafff2" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
